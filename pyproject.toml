[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xreac"
version = "0.2.0"
description = "Parameter-driven Autograd ReaxFF for isolated molecules and clusters"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-2.0-or-later"}
dependencies = ["numpy>=1.24,<3", "autograd>=1.9.1,<2"]

[project.optional-dependencies]
relax = ["scipy>=1.10"]
test = ["pytest>=8", "scipy>=1.10"]
report = ["matplotlib>=3.8"]

[tool.setuptools]
packages = ["xreac", "xreac.data"]

[tool.setuptools.package-dir]
xreac = "src/xreac"
"xreac.data" = "data"

[tool.setuptools.package-data]
"xreac.data" = ["ffield.reax.*", "qeq_ff.water"]

[tool.pytest.ini_options]
pythonpath = ["src", "examples"]
testpaths = ["tests"]
markers = ["reference: requires the lmp_mpi reference executable"]
