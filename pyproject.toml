[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xreac"
version = "0.6.1"
description = "Parameter-driven Autograd ReaxFF for molecules and periodic supercells"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.24,<3", "autograd>=1.9.1,<2"]

[project.urls]
Repository = "https://github.com/hsulab/xreac"
Issues = "https://github.com/hsulab/xreac/issues"

[project.optional-dependencies]
ase = ["ase>=3.26,<4"]
dev = [
    "ase>=3.26,<4",
    "pytest>=8",
    "ruff==0.16.8",
    "sphinx>=5,<9",
    "myst-parser>=0.18,<5",
    "sphinx-rtd-theme>=1.1,<4",
]

[tool.setuptools]
packages = ["xreac", "xreac.data"]

[tool.setuptools.package-dir]
xreac = "src/xreac"
"xreac.data" = "data"

[tool.setuptools.package-data]
"xreac.data" = ["ffield.reax.*"]

[tool.pytest.ini_options]
pythonpath = ["src", "examples", "scripts"]
testpaths = ["tests"]
markers = ["reference: requires the lmp_mpi reference executable"]

[tool.ruff]
line-length = 119
target-version = "py310"
extend-exclude = ["docs/_build"]
