name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
      - name: Install development and packaging tools
        run: python -m pip install '.[dev]' 'build>=1.2,<2' 'twine>=6,<7'
      - name: Check formatting and tests without LAMMPS
        run: |
          python -m ruff format --check .
          python -m pytest -q -m 'not reference'
      - name: Check documentation
        run: |
          python -m sphinx -n -W --keep-going -b html docs docs/_build/html
          python -m sphinx -n -W --keep-going -b doctest docs docs/_build/doctest
      - name: Build source and wheel distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Check release version and generate checksums
        run: |
          python - <<'PY'
          import hashlib
          import os
          from importlib.metadata import version
          from pathlib import Path

          release = version('xreac')
          tag = os.environ['GITHUB_REF_NAME']
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and tag != f'v{release}':
              raise SystemExit(f'Tag {tag} does not match package version {release}')
          notes = Path('CHANGELOG.md').read_text().split(f'## {release}\n', 1)[1].split('\n## ', 1)[0].strip()
          Path('release-notes.md').write_text(notes + '\n')
          artifacts = sorted(Path('dist').glob('*'))
          checksums = ''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in artifacts)
          Path('dist/SHA256SUMS').write_text(checksums)
          PY
      - name: Verify installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import numpy as np
          from xreac import Calculator, ForceField

          for filename in (
              'ffield.reax.HO.2015', 'ffield.reax.CHO.2008', 'ffield.reax.ZnOH.2010',
              'ffield.reax.CuOHCl.2010', 'ffield.reax.CHOCl.2021',
              'ffield.reax.PtNiCHO.2016', 'ffield.reax.PtNiCHO.2026', 'ffield.AgZnO',
          ):
              ff = ForceField.bundled(filename)
              assert ff.path.is_file()
          ff = ForceField.bundled('ffield.reax.HO.2015')
          result = Calculator(ff).evaluate(['O', 'H', 'H'], [[0, 0, 0], [0.97, 0, 0], [-0.243, 0.94, 0]])
          assert abs(result.energy - (-248.34420920633704)) < 1e-8
          assert np.isfinite(result.forces).all()
          assert abs(result.charges.sum()) < 1e-12
          ion = Calculator(ff).evaluate(['O', 'H'], [[0, 0, 0], [0.97, 0, 0]], total_charge=-1)
          assert abs(ion.charges.sum() + 1) < 1e-12
          assert np.isfinite(ion.forces).all()
          PY
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "xreac $GITHUB_REF_NAME" --notes-file release-notes.md
